aid: pitzi
name: Pitzi
description: 'Pitzi is a Brazilian insurtech (founded around 2013) that sells mobile phone
  protection insurance, covering devices against theft, robbery, cracked screens, and accidental
  damage. Customers subscribe to monthly device-protection plans and file claims through an
  online customer portal to get their phone repaired or replaced, with support offered via a
  help center, email, and WhatsApp. Pitzi also distributes through a partner program and is
  backed by DCM Ventures and QED Investors. It operates as a direct-to-consumer and
  partner-distributed fintech/insurtech in Brazil. No public API or developer portal is
  currently published.'
